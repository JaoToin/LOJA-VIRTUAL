<!DOCTYPE html>

    <link rel="stylesheet" href="css/style_estrutura_paginas.css">
</head>

<body>

    <main id="geral">

        <header id="cabecalho">

            <div id="logo">

                <a href="index.html">

                    <img src="imagens/Screenshot_2026-07-02-00-46-20-572_com.miui.gallery.png" alt="logo">

                </a>

            </div>

            <nav id="menu">

                <ul>

                    <li><a href="index.html" class="lnk_menu">HOME</a></li>
                    <li><a href="paginas/cadastro.html" class="lnk_menu">CADASTRO</a></li>
                    <li><a href="paginas/sobre.html" class="lnk_menu">SOBRE</a></li>

                </ul>

            </nav>

            <div id="div-icones">

                <ul>

                    <li><a href="paginas/login.html" class="lnk_icone"><img src="imagens/icones/icones/login.png"
                                alt="LOGIN"></a></li>
                    <li><a href="paginas/carrinho.html" class="lnk_icone"><img src="imagens/icones/icones/carrinho.png"
                                alt="CARRINHO"></a></li>

                </ul>
            </div>

        </header>

        <section id="pesquisa">

            <input type="text" name="pesquisa" id="pesquisa" placeholder="DIGITE SEU PRODUTO">

        </section>

        <section id="cards">

            <div class="card">
                <img src="imagens/lavanda.jpg" alt="flor lavanda " class="img_card">

                <h2 class="tito_card">LAVANDA</h2>

                <h3 class="valor_card">R$ 25,00</h3>

                <button class="bnt_card">ADICIONAR</button>
            </div>

            <div class="card">
                <img src="imagens/lotus.png" alt="flor de lotus " class="img_card">

                <h2 class="tito_card">LOTUS</h2>

                <h3 class="valor_card">R$ 50,00</h3>

                <button class="bnt_card">ADICIONAR</button>
            </div>

            <div class="card">
                <img src="imagens/begonia.jpg" alt="flor begonia " class="img_card">

                <h2 class="tito_card">BEGONIA</h2>

                <h3 class="valor_card">R$ 30,00</h3>

                <button class="bnt_card">ADICIONAR</button>
            </div>

            <div class="card">
                <img src="imagens/flor-de-maio.jpeg" alt="flor de maio " class="img_card">

                <h2 class="tito_card">FLOR DE MAIO</h2>

                <h3 class="valor_card">R$ 35,00</h3>

                <button class="bnt_card">ADICIONAR</button>
            </div>

            <div class="card">
                <img src="imagens/camelias.jpg" alt="flor camelia " class="img_card">

                <h2 class="tito_card">CAMELIA</h2>

                <h3 class="valor_card">R$ 15,00</h3>

                <button class="bnt_card">ADICIONAR</button>
            </div>



        </section>

        <footer id="rodape">
            <div id="dadosloja">
                <h2>RUA DAS FLORES, 1256 - CENTRO</h2>
                <h1>ARACAJU - SERGIPE</h1>
            </div>

            <div id="icones_sociais">
                <ul>
                    <li><a href="https://www.instagram.com/seu_usuario"><img src="imagens/icones/icones/instagram.png" alt=""></a></li>

                    <li><a href="https://www.facebook.com/seu_usuario"><img src="imagens/icones/icones/facebook.jpg" alt=""></a></li>

                  
                </ul>
            </div>

            <div id="div-cartoes">
                <img src="imagens/icones/icones/hipercard.png" alt="Hipercard">
                <img src="imagens/icones/icones/visa.png" alt="Visa">
                <img src="imagens/icones/icones/master_card.png" alt="Mastercard">
            </div>
        </footer>
